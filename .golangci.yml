version: "2"

# The default linters: errcheck, govet, ineffassign, staticcheck, unused.

linters:
  settings:
    staticcheck:
      checks:
        # staticcheck's defaults ...
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # ... and QF1008: brw.Reader.Peek reads better next to
        # brw.Reader.Buffered, where the embedded field cannot be left out.
        - -QF1008

  exclusions:
    rules:
      # Errors go-polipo ignores on purpose: writes to a client that may be
      # gone, removing a file that may be gone, and copying a body or tunnel
      # until either side stops. Reviewed one by one on 2026-11-09; none
      # needs handling. Closes and deadlines are marked with `_ =` in the
      # code instead; do the same for new cases rather than adding here.
      - linters: [errcheck]
        text: "Error return value of `(fmt\\.Fprint|fmt\\.Fprintf|fmt\\.Fprintln|io\\.Copy|os\\.Remove|filepath\\.WalkDir|clientConn\\.Write|w\\.Write)` is not checked"
      # Tests ignore errors from their own fixtures; a failure there shows
      # up in what the test checks.
      - linters: [errcheck]
        path: _test\.go

issues:
  # Report every finding. By default golangci-lint shows at most 3 with the
  # same text and 50 per linter, which hides how many sites a change touches.
  max-issues-per-linter: 0
  max-same-issues: 0
